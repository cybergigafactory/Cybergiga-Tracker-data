name: Update tracker

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: TxDMV abrufen
        run: python3 scripts/update_tracker.py

      - name: Commit nur bei Änderung
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker.json data/vins.json states.json
          if git diff --cached --quiet; then
            echo "Keine Änderung, kein Commit."
          else
            git commit -m "Aktualisiere Tracker $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
